name: Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the app
        run: bun install

      - name: Install the documentation site
        working-directory: documentation
        run: bun install

      - name: Generate the markdown
        run: bun scripts/generate-docs.mjs

      - name: Build the static site into /docs
        working-directory: documentation
        run: bun run generate

      - name: Keep GitHub Pages from running Jekyll
        run: touch docs/.nojekyll

      - name: Commit the generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/content docs
          if git diff --staged --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi
          git commit -m "docs: regenerate documentation [skip ci]"
          git push
