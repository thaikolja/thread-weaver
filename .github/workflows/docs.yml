name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the app
        run: bun install

      - name: Install the docs app
        run: bun install --cwd docs

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build the site, including /docs
        run: bun run build:site
        env:
          NUXT_SITE_URL: https://weaver.yanawa.io

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public

      - name: Commit regenerated markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content docs/public/logo.svg
          if git diff --staged --quiet; then
            echo "Documentation markdown is already up to date."
            exit 0
          fi
          git commit -m "docs: regenerate Docus pages [skip ci]"
          git push

      - name: Deploy the preview when Cloudflare credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare credentials. /docs is in the site artifact."
            exit 0
          fi
          bun x wrangler deploy --no-autoconfig
