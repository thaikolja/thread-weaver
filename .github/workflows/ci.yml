name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Test with Vitest
        run: bun run test:vitest

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
