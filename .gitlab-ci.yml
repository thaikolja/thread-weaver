# Build the editor and the Docus site on every push to main.
# The pages land at /docs. A Cloudflare deploy runs only when the token variables exist.

stages:
  - test
  - build
  - publish

test:
  stage: test
  image: oven/bun:1
  script:
    - bun install
    - bun test
    - bun run typecheck
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

build-site:
  stage: build
  image: oven/bun:1
  needs:
    - test
  before_script:
    - apt-get update && apt-get install -y python3 make g++
  script:
    - bun install
    - bun install --cwd docs
    - bun run build:site
  variables:
    NUXT_SITE_URL: https://weaver.yanawa.io
  artifacts:
    paths:
      - .output/public
      - docs/content
      - docs/public/logo.svg
    expire_in: 7 days

commit-docs:
  stage: publish
  image: alpine:3.22
  needs:
    - build-site
  allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@users.noreply.gitlab.com"
    - git add docs/content docs/public/logo.svg
    - |
      if git diff --staged --quiet; then
        echo "Documentation markdown is already up to date."
        exit 0
      fi
    - 'git commit -m "docs: regenerate Docus pages [skip ci]"'
    - 'git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-preview:
  stage: publish
  image: oven/bun:1
  needs:
    - build-site
  script:
    - bun install
    - bun x wrangler deploy --no-autoconfig
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID
